<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><style>body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Archive Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=VT323&display=swap">
<style>
/* Layout: one full-bleed black table surface; archive objects float on it; chrome tucked into the corners. Single dark theme by design. */
:root {
  --table: #050506;
  --chrome: rgba(22, 21, 24, 0.88);
  --chrome-line: rgba(236, 232, 222, 0.16);
  --ink: #ece8de;
  --ink-dim: rgba(236, 232, 222, 0.55);
  --paper: #f2eee4;
  --paper-ink: #2b2620;
  --amber: #e9b44c;
  --font-hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-vcr: "VT323", ui-monospace, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--table);
  color: var(--ink);
  font-family: var(--font-mono);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
}
#table {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 50% 45%, rgba(255,255,255,0.035), transparent 70%),
    var(--table);
}
.item {
  position: absolute; left: 0; top: 0;
  will-change: transform;
  cursor: grab;
}
.item.lifted { cursor: grabbing; }

/* Photos */
.photo {
  background: var(--paper);
  padding: 4% 4% 0;
  border-radius: 2px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.65), 0 1px 2px rgba(0,0,0,0.5);
  transition: box-shadow 0.18s ease;
}
.photo img { display: block; width: 100%; height: auto; pointer-events: none; }
.photo .cap {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  padding: 0.35em 0.1em 0.5em;
  color: var(--paper-ink);
}
.photo .cap b { font: 600 1.25em/1.1 var(--font-hand); }
.photo .cap small { font: 400 0.62em/1 var(--font-mono); letter-spacing: 0.04em; opacity: 0.55; white-space: nowrap; }
.lifted.photo, .lifted .cassette {
  box-shadow: 0 26px 60px rgba(0,0,0,0.75), 0 8px 18px rgba(0,0,0,0.5);
}

/* VHS cassette */
.cassette {
  aspect-ratio: 187 / 103;
  background: linear-gradient(170deg, #2b2b30, #141417 60%, #1b1b1f);
  border-radius: 5px;
  padding: 5% 6% 0;
  box-shadow: 0 5px 16px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
  transition: box-shadow 0.18s ease;
  display: flex; flex-direction: column; gap: 7%;
}
.cassette .label {
  height: 40%;
  background:
    repeating-linear-gradient(transparent 0 calc(1.15em - 1px), rgba(60,80,140,0.25) calc(1.15em - 1px) 1.15em),
    var(--sticker, #efe9da);
  border-radius: 2px;
  padding: 2% 4%;
  color: #1d2b6b;
  display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
}
.cassette .label b { font: 600 1.3em/1 var(--font-hand); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cassette .label small { font: 500 0.56em/1 var(--font-mono); letter-spacing: 0.08em; color: rgba(0,0,0,0.55); text-transform: uppercase; }
.cassette .win {
  height: 32%;
  margin-inline: 12%;
  background: linear-gradient(#0c0c0e, #19191c);
  border-radius: 3px;
  box-shadow: inset 0 1px 4px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.05);
  display: flex; justify-content: space-around; align-items: center;
}
.cassette .reel {
  height: 86%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle, #d8d4ca 0 16%, #3a3a3e 17% 24%, #3b2a1d 25% var(--wind, 70%), transparent calc(var(--wind, 70%) + 1%));
}
.cassette { position: relative; }
.cassette .play-hint {
  position: absolute; right: 7%; bottom: 8%;
  font: 500 0.55em/1 var(--font-mono); letter-spacing: 0.1em; color: rgba(255,255,255,0.35);
}

/* TV + VCR: a 90s black-plastic TV/VCR combo. The screen sits in a sloped bezel (four shaded borders),
   the cassette slot and a strip of small labelled buttons sit under it, speaker slots at the bottom right. */
.tv { position: absolute; cursor: grab; --pl-hi: #303034; --pl: #202023; --pl-lo: #151517; --print: #c9c8cc; }
.tv.pinned { cursor: default; }
.tv::after {
  content: ""; position: absolute; left: 3%; right: 3%; bottom: -1em; height: 2em; z-index: -2;
  background: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0.85), rgba(0,0,0,0.4) 45%, transparent 72%);
}
.tv .cab-top {
  height: 1.2em; margin: 0 0.25em; position: relative;
  clip-path: polygon(3% 0, 97% 0, 100% 100%, 0 100%);
  background: linear-gradient(#2a2a2e, #38383d);
}
.tv .cab-top::after { content: ""; position: absolute; inset: auto 0 0 0; height: 1px; background: rgba(255,255,255,0.22); }
.tv .cab {
  position: relative;
  border-radius: 0.5em 0.5em 0.7em 0.7em;
  padding: 1.1em 1.3em 0.9em;
  background:
    radial-gradient(ellipse 80% 50% at 30% 0%, rgba(255,255,255,0.06), transparent 70%),
    linear-gradient(175deg, var(--pl-hi), var(--pl) 35%, var(--pl-lo));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.14), inset 0.15em 0 0.2em rgba(255,255,255,0.04),
    inset -0.3em 0 0.5em rgba(0,0,0,0.45), inset 0 -0.35em 0.6em rgba(0,0,0,0.55),
    0 0.6em 1.4em rgba(0,0,0,0.65);
  display: flex; flex-direction: column; gap: 0.55em;
}
/* sloped frame around the tube: each border is one face of the slope, lit from the top left */
.tv .bezel {
  border-style: solid; border-width: 1.2em 1.35em 1.5em 1.35em;
  border-color: #0e0e10 #19191c #2c2c30 #1d1d20;
  border-radius: 1.4em;
  background: #050506;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 0 0 0.2em rgba(0,0,0,0.35), inset 0 0 0 1px #000;
}
.tv .screen {
  position: relative; overflow: hidden; background: #0a0b0c;
  border-radius: 1.5em / 1.9em;
  box-shadow: inset 0 0 1.2em rgba(0,0,0,0.9);
  transition: box-shadow 0.4s ease;
}
.tv.on .screen { box-shadow: 0 0 1.6em rgba(130,170,255,0.25); }
.tv canvas { display: block; width: 100%; aspect-ratio: 4 / 3; height: auto; pointer-events: none; transform: scale(1.025); filter: blur(0.25px) contrast(1.06) saturate(1.08); }
.tv canvas.osd { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; filter: blur(0.2px); }
.tv .yt { position: absolute; inset: 0; overflow: hidden; background: #000; }
.tv .yt iframe { position: absolute; top: -1.5%; left: -18%; width: 136%; height: 103%; border: 0; pointer-events: none; filter: saturate(0.78) contrast(1.1) sepia(0.08) blur(0.45px); }
.tv .mask, .tv .glass { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; }
.tv .mask {
  background:
    repeating-linear-gradient(90deg, rgba(255,0,0,0.06) 0 1px, rgba(0,255,0,0.05) 1px 2px, rgba(0,80,255,0.06) 2px 3px),
    repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0 1px, transparent 1px 3px);
  mix-blend-mode: multiply;
}
.tv .glass {
  background:
    radial-gradient(ellipse 120% 95% at 50% 50%, transparent 58%, rgba(0,0,0,0.38) 82%, rgba(0,0,0,0.8) 100%),
    radial-gradient(ellipse 55% 30% at 28% 14%, rgba(255,255,255,0.15), transparent 70%),
    linear-gradient(162deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 34%, transparent 34.5%);
  box-shadow: inset 0 0 0.6em rgba(0,0,0,0.85);
}
.tv .brand { text-align: center; font: 700 0.95em/1 var(--font-mono); letter-spacing: 0.32em; color: #e2e1e5; text-shadow: 0 1px 0 #000; margin-top: -0.1em; }

/* built-in VCR */
.tv .deck { display: flex; flex-direction: column; align-items: center; gap: 0.45em; }
.tv .slot {
  position: relative; width: 62%; height: 2.3em; border-radius: 0.25em; overflow: hidden;
  background: #020203;
  box-shadow: inset 0 0.2em 0.4em rgba(0,0,0,1), 0 0 0 0.14em #0b0b0d, 0 0.12em 0 rgba(255,255,255,0.08);
  display: grid; place-items: center;
  transition: box-shadow 0.2s ease;
}
.tv .slot::before {
  content: ""; position: absolute; left: 2%; right: 2%; top: 10%; bottom: 10%;
  background: linear-gradient(rgba(255,255,255,0.07), transparent 20%), linear-gradient(#2a2a2e, #1a1a1d 60%, #131315);
  border-radius: 0.12em;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), inset 0 -1px 0 rgba(0,0,0,0.6);
  transform-origin: 50% 0; transition: transform 0.18s ease, filter 0.18s ease;
}
.tv .slot.open::before { transform: perspective(80px) rotateX(-78deg); filter: brightness(0.45); }
.tv .slot span { position: relative; font: 600 0.48em/1 var(--font-mono); letter-spacing: 0.32em; color: rgba(230,230,235,0.3); }
.tv .slot.ready { box-shadow: inset 0 0.2em 0.4em rgba(0,0,0,1), 0 0 0 0.14em var(--amber), 0 0 1.4em rgba(233,180,76,0.6); }
.tv .slot.ready span { color: var(--amber); }
.tv .slot.call { animation: call 0.5s ease 3; }
@keyframes call { 50% { box-shadow: inset 0 0.2em 0.4em rgba(0,0,0,1), 0 0 0 0.14em var(--amber), 0 0 1.8em rgba(233,180,76,0.75); } }
.tv .combo { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 0.6em; }
.tv .combo b { font: italic 600 0.62em/1 var(--font-mono); letter-spacing: 0.08em; color: var(--print); white-space: nowrap; }
.tv .combo .hifi { justify-self: end; font: 500 0.45em/1 var(--font-mono); letter-spacing: 0.14em; color: rgba(201,200,204,0.6); }
.tv .vfd {
  justify-self: start; background: #04100f; border-radius: 0.15em; padding: 0.15em 0.45em;
  box-shadow: inset 0 0.08em 0.2em rgba(0,0,0,0.95), 0 0 0 1px #0a0a0b;
}
.tv .led { font: 1.05em/1 var(--font-vcr); color: #7ff7e3; text-shadow: 0 0 0.25em rgba(100,255,230,0.85); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tv .deck.thunk { animation: thunk 0.28s ease; }
.tv .deck.running .led { animation: ledrun 0.3s steps(2) infinite; }
@keyframes thunk { 0% { transform: translateY(0); } 30% { transform: translateY(2px); } 60% { transform: translateY(-1px); } 100% { transform: translateY(0); } }
@keyframes ledrun { 50% { opacity: 0.55; } }
.tv .ctrl { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5em; padding-top: 0.15em; border-top: 1px solid rgba(255,255,255,0.06); }
.tv .ctrl .b { display: flex; flex-direction: column; align-items: center; gap: 0.25em; }
.tv .ctrl .b span { font: 500 0.42em/1 var(--font-mono); letter-spacing: 0.14em; color: var(--print); }
.tv .ctrl button {
  width: 100%; height: 1.5em; min-height: 28px; border-radius: 0.2em; cursor: pointer;
  font: 600 0.6em/1 var(--font-mono); color: #b8b7bc; display: grid; place-items: center;
  background: linear-gradient(#2e2e32, #18181b); border: 0;
  box-shadow: 0 0.14em 0 #070708, 0 0.2em 0.3em rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.14);
  transition: transform 0.06s ease, box-shadow 0.06s ease;
}
.tv .ctrl button:active:not(:disabled) { transform: translateY(0.11em); box-shadow: 0 0.03em 0 #070708, inset 0 1px 0 rgba(255,255,255,0.08); }
.tv .ctrl button:disabled { opacity: 0.45; cursor: default; }
.tv input[type=range] { width: 100%; min-width: 0; accent-color: #7ff7e3; height: 20px; margin: 0; cursor: pointer; }
.tv .bottom { display: flex; justify-content: space-between; align-items: center; gap: 0.8em; }
.tv .bl { display: flex; align-items: center; gap: 0.6em; }
.tv .pwr { width: 0.5em; height: 0.5em; border-radius: 50%; background: #3a1414; box-shadow: inset 0 0.05em 0.1em rgba(0,0,0,0.8); }
.tv.on .pwr { background: #ff4436; box-shadow: 0 0 0.5em #ff3b30; }
.tv .jacks { display: flex; gap: 0.35em; }
.tv .jacks i { width: 0.75em; height: 0.75em; border-radius: 50%; background: radial-gradient(circle, #111 0 28%, var(--j) 30% 62%, #0a0a0a 64%); box-shadow: 0 0 0 0.1em #0b0b0c; }
.tv .grille { width: 30%; height: 1.6em; border-radius: 0.2em; background: repeating-linear-gradient(90deg, #050506 0 0.28em, transparent 0.28em 0.55em); opacity: 0.9; }
.tv .pin {
  min-height: 28px; padding: 0.4em 0.75em; border-radius: 0.25em; cursor: pointer;
  font: 600 0.5em/1 var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase;
  display: inline-flex; gap: 0.35em; align-items: center;
  color: #b8b7bc; background: linear-gradient(#2e2e32, #18181b); border: 0;
  box-shadow: 0 0.12em 0 #070708, 0 0.2em 0.3em rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.14);
}
.tv.pinned .pin { color: var(--amber); }
.tv .feet { display: flex; justify-content: space-between; padding: 0 12%; }
.tv .feet i { width: 2.2em; height: 0.35em; background: #0c0c0d; border-radius: 0 0 0.2em 0.2em; }
.tv button:focus-visible, .bar button:focus-visible, .panel button:focus-visible, .panel input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

/* Filter + search panel */
.panel {
  position: fixed; z-index: 100000;
  top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px));
  width: min(330px, calc(100% - 32px));
  background: rgba(14,13,16,0.9); border: 1px solid var(--chrome-line); border-radius: 14px;
  padding: 12px; display: flex; flex-direction: column; gap: 10px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.panel { width: min(330px, calc(100% - 32px)); transition: width 0.2s ease; }
.panel.collapsed { width: auto; max-width: calc(100% - 32px); padding: 4px; border-radius: 999px; }
.panel.collapsed .panel-body { display: none; }
.panel-body { display: flex; flex-direction: column; gap: 10px; }
.ptoggle {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: none; border: 0; color: var(--ink); cursor: pointer; text-align: left;
  padding: 6px 4px; border-radius: 999px;
}
.panel.collapsed .ptoggle { padding: 8px 14px 8px 12px; }
.ptoggle .pt-icon { display: grid; place-items: center; color: var(--amber); }
.ptoggle .pt-sum { font: 400 11px/1 var(--font-mono); color: var(--ink-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ptoggle .pt-sum.active { color: var(--amber); }
.ptoggle .pt-chev { margin-left: auto; color: var(--ink-dim); transition: transform 0.2s ease; }
.panel:not(.collapsed) .ptoggle .pt-chev { transform: rotate(180deg); }
.ptoggle:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.panel strong { font: 500 11px/1 var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink); }
.panel .sub { font: 400 10.5px/1.3 var(--font-mono); color: var(--ink-dim); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button {
  font: 500 12px/1 var(--font-mono); color: var(--ink); background: #1f1e23; border: 1px solid var(--chrome-line);
  border-radius: 999px; padding: 9px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.chips button em { font-style: normal; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.chips button[aria-pressed="true"] { background: var(--amber); border-color: var(--amber); color: #17130b; }
.chips button[aria-pressed="true"] em { color: rgba(23,19,11,0.65); }
.chips button:disabled { opacity: 0.4; cursor: default; }
.chips.decades button { padding: 7px 10px; font-size: 11px; }
.search { position: relative; }
.search input {
  width: 100%; box-sizing: border-box; font: 400 13px/1 var(--font-mono); color: var(--ink);
  background: #0a0a0c; border: 1px solid var(--chrome-line); border-radius: 10px; padding: 11px 34px 11px 12px;
  user-select: text; -webkit-user-select: text; touch-action: manipulation;
}
.search input::placeholder { color: rgba(236,232,222,0.38); }
.search button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; border: 0; background: none; color: var(--ink-dim); font-size: 16px; cursor: pointer; }
.panel .count { font: 400 11px/1.3 var(--font-mono); color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.panel .count b { color: var(--amber); font-weight: 500; }

.bar {
  position: fixed; z-index: 100000;
  left: calc(16px + env(safe-area-inset-left, 0px));
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  right: calc(16px + env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px; pointer-events: none;
}
.bar button {
  pointer-events: auto;
  font: 500 12px/1 var(--font-mono); letter-spacing: 0.06em;
  color: var(--ink); background: var(--chrome); border: 1px solid var(--chrome-line);
  border-radius: 999px; padding: 11px 15px; cursor: pointer;
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.bar button:hover { background: #2a282c; }
.bar button.add { color: #17130b; background: var(--amber); border-color: var(--amber); }
.hint {
  position: fixed; z-index: 99999; left: 50%; bottom: calc(66px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  max-width: min(560px, calc(100% - 32px));
  font: 400 12px/1.5 var(--font-mono); color: var(--ink-dim); text-align: center;
  background: rgba(10,10,12,0.75); border: 1px solid var(--chrome-line); border-radius: 12px;
  padding: 8px 14px; pointer-events: none;
  transition: opacity 0.8s ease;
}
.hint.gone { opacity: 0; }
.drop {
  position: fixed; inset: 12px; z-index: 100001; border: 2px dashed var(--amber); border-radius: 18px;
  display: grid; place-items: center; font: 500 14px/1 var(--font-mono); color: var(--amber);
  background: rgba(233,180,76,0.06); pointer-events: none;
}
@media (max-width: 640px) {
  .chips.decades, .panel .sub { display: none; }
  .panel { padding: 10px; gap: 8px; }
  .hint { display: none; }
  .bar button { padding: 10px 12px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) {
  .hint { transition: none; }
}
</style>

<div id="table" aria-label="Archive table"></div>

<div class="panel collapsed" id="panel">
  <button class="ptoggle" id="ptoggle" type="button" aria-expanded="false" aria-controls="pbody">
    <span class="pt-icon" aria-hidden="true"><svg viewBox="0 0 16 16" width="14" height="14"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 10l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
    <strong>Search &amp; filter</strong>
    <span class="pt-sum" id="psum"></span>
    <span class="pt-chev" aria-hidden="true">▾</span>
  </button>
  <div class="panel-body" id="pbody">
  <div class="sub">Gemeenschapsarchief Eindhoven · concept with sample items · build 6 (tapes on top, no slider)</div>
  <div class="chips" id="kinds" role="group" aria-label="Show">
    <button type="button" data-kind="all" aria-pressed="true">All <em></em></button>
    <button type="button" data-kind="photo" aria-pressed="false">Photos <em></em></button>
    <button type="button" data-kind="tape" aria-pressed="false">VHS tapes <em></em></button>
    <button type="button" data-kind="audio" aria-pressed="false" disabled title="Coming later">Audio <em>soon</em></button>
  </div>
  <div class="search">
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="carnaval, 1960-1975, 80s" aria-label="Search the archive by words or years">
    <button id="qclear" type="button" aria-label="Clear search" hidden>×</button>
  </div>
  <div class="chips decades" id="decades" role="group" aria-label="Decade">
    <button type="button" data-dec="1950" aria-pressed="false">1950s</button>
    <button type="button" data-dec="1960" aria-pressed="false">1960s</button>
    <button type="button" data-dec="1970" aria-pressed="false">1970s</button>
    <button type="button" data-dec="1980" aria-pressed="false">1980s</button>
    <button type="button" data-dec="1990" aria-pressed="false">1990s</button>
  </div>
  <div class="count" id="count" aria-live="polite"></div>
  </div>
</div>
<div class="hint" id="hint">Drag with one finger · pinch to resize and turn · double-tap to look closer · slide a tape into the VCR to play it</div>
<div class="bar">
  <button id="spread" type="button">Spread out</button>
  <button id="stack" type="button">Pile up</button>
  <button id="full" type="button">Fullscreen</button>
  <button id="sound" type="button" aria-pressed="true">Sound on</button>
  <button id="add" class="add" type="button">+ Add photos or video</button>
</div>
<input id="file" type="file" accept="image/*,video/*" multiple hidden>

/* ---------- boot ---------- */
PHOTOS.forEach((p, i) => makePhoto(renderPhoto(p, i), p.cap, `${p.year} · EHV-${String(p.year).slice(2)}${String(i * 37 + 104).padStart(3, '0')}`, p.portrait, p.year, p.mode === 'color' ? 'kleur color' : 'zwart-wit black white'));
TAPES.forEach(t => makeTape(Object.assign({ year: t.date[0] }, t)));
YT_TAPES.forEach(t => makeTape(t));
makeTV();
layoutTV(false);
spread(false, 20261111);
// leave one tape lying just below the slot so the first move is obvious
const firstTape = items.find(i => i.kind === 'tape' && i.spec.youtube) || items.find(i => i.kind === 'tape');
if (firstTape) { const g = slotGeom(), r = tv.el.getBoundingClientRect(); firstTape.x = g.x - 10; firstTape.y = Math.min(r.bottom + firstTape.el.offsetHeight / 2 + 26, innerHeight - firstTape.el.offsetHeight / 2 - 70); firstTape.rot = 0.08; raise(firstTape); apply(firstTape); }
applyFilter();
requestAnimationFrame(frame);
})();
</script>
